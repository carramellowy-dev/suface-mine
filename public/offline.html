<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - Surface Mine Production</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; text-align: center; padding: 48px 20px; background: #f5f7fa; color: #1e3a5f; margin: 0; }
        .container { max-width: 400px; margin: 0 auto; }
        .icon { width: 80px; height: 80px; background: #fee2e2; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 24px; }
        .icon .material-symbols-outlined { font-size: 40px; color: #dc2626; }
        h1 { color: #1e3a5f; font-size: 24px; margin-bottom: 12px; }
        p { color: #64748b; line-height: 1.6; }
        .badge { display: inline-block; background: #fef3c7; color: #92400e; padding: 8px 16px; border-radius: 20px; font-size: 14px; font-weight: 500; margin-top: 16px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">
            <span class="material-symbols-outlined">wifi_off</span>
        </div>
        <h1>Koneksi Terputus</h1>
        <p>Anda sedang dalam mode offline. Data tersimpan lokal dan akan dikirim otomatis saat tersambung kembali.</p>
        <div class="badge">
            <span class="material-symbols-outlined" style="font-size: 16px; vertical-align: middle; margin-right: 4px;">cloud_off</span>
            Mode Offline
        </div>
    </div>
</body>
</html>
